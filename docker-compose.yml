services:
    postgres:
        image: postgres:16-alpine
        container_name: admin-panel-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-admin}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
            POSTGRES_DB: ${POSTGRES_DB:-admin_panel}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
                ]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - backend

    migrate:
        build:
            context: .
            dockerfile: Dockerfile
            target: migrator
        restart: 'no'
        env_file:
            - .env
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - backend

    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: runner
        container_name: admin-panel-app
        restart: unless-stopped
        env_file:
            - .env
        environment:
            COOKIE_SECURE: ${COOKIE_SECURE:-false}
            UPLOAD_DIR: /app/uploads
        ports:
            - '3002:3000'
        volumes:
            - ./uploads:/app/uploads
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - backend

volumes:
    postgres_data:
        driver: local

networks:
    backend:
        driver: bridge
